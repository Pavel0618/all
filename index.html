<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Радар X-гемов: тренды, проверка контракта, график, нарратив и покупка в один клик из своего кошелька." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Gem Radar</title>
    <script>
      // SDK Telegram Mini Apps грузим только внутри Telegram, чтобы не замедлять обычный сайт
      (function () {
        var inTg = /tgWebApp/.test(location.hash + location.search) || !!window.TelegramWebviewProxy;
        try { inTg = inTg || !!sessionStorage.getItem('__telegram__initParams'); } catch (e) {}
        if (inTg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
