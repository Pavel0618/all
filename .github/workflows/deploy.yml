# Публикация: сервер (Cloudflare Worker) → сайт (GitHub Pages) → настройка Telegram-бота.
# Один раз: Settings → Pages → Source: GitHub Actions. Ключи — в Settings → Secrets and variables → Actions
# (пошагово: docs/SERVER_SETUP.md). Без ключей Cloudflare публикуется только сайт, как раньше.
#
# Безопасность (docs/SECURITY.md):
#  • каждый секрет виден только тому шагу, которому он нужен — не установке пакетов и не сборке;
#  • пакеты ставятся с --ignore-scripts: чужой код из npm не запускается при установке;
#  • действия GitHub закреплены по коммиту, а не по тегу, который можно перевесить;
#  • значения переменных попадают в скрипты через env, а не подстановкой ${{ }} в текст команды.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  worker:
    name: Server (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      site: ${{ steps.site.outputs.url }}
    steps:
      - name: Site address
        id: site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="$SITE_URL"
          if [ -z "$url" ]; then url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Is Cloudflare configured
        id: cf
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "on=$HAS_CF" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CF" != "true" ]; then echo "::notice::Сервер не опубликован — добавьте секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID (docs/SERVER_SETUP.md)"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cf.outputs.on == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cf.outputs.on == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.on == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy worker
        id: deploy
        if: steps.cf.outputs.on == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ steps.site.outputs.url }}
          ALERT_CHAT_ID: ${{ vars.ALERT_CHAT_ID }}
          DAILY_TWITTER_BUDGET: ${{ vars.DAILY_TWITTER_BUDGET }}
        run: |
          args=(--var "SITE_URL:$SITE_URL")
          [ -n "$ALERT_CHAT_ID" ] && args+=(--var "ALERT_CHAT_ID:$ALERT_CHAT_ID")
          [ -n "$DAILY_TWITTER_BUDGET" ] && args+=(--var "DAILY_TWITTER_BUDGET:$DAILY_TWITTER_BUDGET")
          npx wrangler deploy -c worker/wrangler.toml "${args[@]}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Не удалось узнать адрес сервера. Откройте Cloudflare → Workers & Pages один раз, чтобы создать поддомен workers.dev"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Secrets
        if: steps.cf.outputs.on == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Значение идёт через stdin — его нет ни в аргументах команды, ни в логе
          if [ -n "$TWITTERAPI_KEY" ]; then printf '%s' "$TWITTERAPI_KEY" | npx wrangler secret put TWITTERAPI_KEY -c worker/wrangler.toml; fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN -c worker/wrangler.toml; fi
      - name: Check server
        if: steps.cf.outputs.on == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: curl -fsS "$WORKER_URL/health" && echo
      - name: Configure Telegram bot
        if: steps.cf.outputs.on == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Бот не настроен: нет секрета TELEGRAM_BOT_TOKEN"; exit 0; fi
          node worker/setup-bot.mjs "$WORKER_URL" "$SITE_URL"

  build:
    name: Site
    needs: worker
    # Сайт публикуется, даже если сервер не настроен или упал (тогда без Twitter-анализа)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Bot username for share links
        env:
          TG_BOT: ${{ vars.TG_BOT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          bot="$TG_BOT"
          if [ -z "$bot" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            bot=$(curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).result?.username??''))" || true)
          fi
          # Только буквы, цифры и _ — иначе это не username бота
          if ! [[ "$bot" =~ ^[A-Za-z0-9_]{0,64}$ ]]; then bot=""; fi
          echo "VITE_TG_BOT=$bot" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables (необязательно: значения по умолчанию — в src/config.ts)
          VITE_FEE_BPS: ${{ vars.FEE_BPS }}
          VITE_FEE_SOLANA_WALLET: ${{ vars.FEE_SOLANA_WALLET }}
          VITE_FEE_EVM_WALLET: ${{ vars.FEE_EVM_WALLET }}
          VITE_TG_APP: ${{ vars.TG_APP }}
          VITE_LIFI_INTEGRATOR: ${{ vars.LIFI_INTEGRATOR }}
          VITE_SIGNALS_URL: ${{ needs.worker.outputs.url || vars.SIGNALS_URL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Publish site
    needs: build
    runs-on: ubuntu-latest
    # Права на публикацию — только у этого шага
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
