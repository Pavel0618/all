name: CI

on:
  push:
    branches: [main]
  pull_request:

# Проверка чужих PR идёт без секретов и только с правом чтения
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # Только headless-сборка Chromium: меньше скачивать; таймаут — чтобы зависшая загрузка не висела часами
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8
      - run: npm run e2e
        timeout-minutes: 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: e2e/screenshots
