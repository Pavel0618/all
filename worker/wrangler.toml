# Сервер Gem Radar: Twitter-анализ для сайта и Telegram-бот с алертами.
# Деплой делает GitHub Actions (.github/workflows/deploy.yml); вручную: npx wrangler deploy -c worker/wrangler.toml
name = "gem-radar"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Сканер алертов: каждые 15 минут одна сеть по кругу
[triggers]
crons = ["*/15 * * * *"]

# Хранилище создаётся автоматически при первом деплое
[[kv_namespaces]]
binding = "KV"

# Защита от злоупотреблений: Twitter-проверки стоят денег и ограничены дневным лимитом,
# поэтому один IP (сайт) или один чат (бот) не может отправлять их пачками
[[ratelimits]]
name = "SIGNALS_LIMIT"
namespace_id = "4663001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "BOT_LIMIT"
namespace_id = "4663002"
  [ratelimits.simple]
  limit = 8
  period = 60

[vars]
DAILY_TWITTER_BUDGET = "120"
SCAN_TWITTER_PER_RUN = "1"

[observability]
enabled = true
